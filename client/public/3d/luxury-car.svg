<svg width="400" height="240" viewBox="0 0 400 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="carBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF8A9D;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E85D75;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="carTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFB3C1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FF8A9D;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="window" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1A1A2E;stop-opacity:0.9" />
      <stop offset="100%" style="stop-color:#2D2D44;stop-opacity:0.9" />
    </linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-opacity="0.15"/></filter>
  </defs>
  <!-- Shadow -->
  <ellipse cx="200" cy="210" rx="110" ry="18" fill="rgba(20,20,50,0.08)"/>
  <!-- Car body -->
  <g filter="url(#shadow)">
    <!-- Main body -->
    <path d="M 60 140 Q 60 110 90 110 L 140 95 L 240 95 Q 280 95 300 110 L 340 140 Q 350 150 340 165 L 70 165 Q 50 165 60 140 Z" fill="url(#carBody)" stroke="#E85D75" stroke-width="1.5"/>
    <!-- Top -->
    <path d="M 140 95 L 170 70 Q 180 65 190 70 L 260 95 Z" fill="url(#carTop)" stroke="#E85D75" stroke-width="1.5"/>
    <!-- Windows -->
    <path d="M 175 75 L 190 72 L 255 95 L 170 95 Z" fill="url(#window)"/>
    <path d="M 145 95 L 165 78 L 175 78 L 170 95 Z" fill="url(#window)"/>
    <!-- Headlight -->
    <ellipse cx="335" cy="135" rx="8" ry="10" fill="#FFFBF5" stroke="#E85D75" stroke-width="1"/>
    <ellipse cx="335" cy="135" rx="4" ry="5" fill="white" opacity="0.8"/>
    <!-- Taillight -->
    <ellipse cx="65" cy="135" rx="6" ry="8" fill="#FF3B30" opacity="0.9"/>
    <!-- Door line -->
    <path d="M 190 95 L 190 165" stroke="rgba(20,20,50,0.15)" stroke-width="1" stroke-dasharray="4 4"/>
    <!-- Wheels -->
    <g>
      <ellipse cx="110" cy="165" rx="28" ry="28" fill="#1A1A2E"/>
      <ellipse cx="110" cy="165" rx="18" ry="18" fill="#2D2D44" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
      <circle cx="110" cy="165" r="6" fill="#FFFBF5"/>
      <g transform="rotate(0 110 165)"><rect x="108" y="145" width="4" height="40" rx="2" fill="rgba(255,255,255,0.15)"/></g>
      <g transform="rotate(90 110 165)"><rect x="108" y="145" width="4" height="40" rx="2" fill="rgba(255,255,255,0.15)"/></g>
    </g>
    <g>
      <ellipse cx="280" cy="165" rx="28" ry="28" fill="#1A1A2E"/>
      <ellipse cx="280" cy="165" rx="18" ry="18" fill="#2D2D44" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
      <circle cx="280" cy="165" r="6" fill="#FFFBF5"/>
      <g transform="rotate(0 280 165)"><rect x="278" y="145" width="4" height="40" rx="2" fill="rgba(255,255,255,0.15)"/></g>
      <g transform="rotate(90 280 165)"><rect x="278" y="145" width="4" height="40" rx="2" fill="rgba(255,255,255,0.15)"/></g>
    </g>
  </g>
  <!-- Highlight -->
  <path d="M 90 115 Q 110 105 140 102" stroke="rgba(255,255,255,0.4)" stroke-width="2" fill="none" stroke-linecap="round"/>
</svg>