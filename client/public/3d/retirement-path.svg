<svg width="400" height="240" viewBox="0 0 400 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sky" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#FFF7E6"/><stop offset="100%" stop-color="#E0F2FE"/></linearGradient>
    <filter id="sh"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-opacity="0.1"/></filter>
  </defs>
  <rect width="400" height="240" rx="16" fill="url(#sky)"/>
  <!-- Sun -->
  <circle cx="320" cy="50" r="22" fill="#FFD700" opacity="0.9"/>
  <circle cx="320" cy="50" r="14" fill="#FFA500" opacity="0.6"/>
  <!-- Clouds -->
  <g fill="white" opacity="0.8">
    <ellipse cx="100" cy="40" rx="18" ry="10"/><ellipse cx="115" cy="35" rx="14" ry="8"/><ellipse cx="85" cy="38" rx="12" ry="7"/>
  </g>
  <!-- Hills -->
  <path d="M 0 140 Q 80 100 160 130 Q 240 160 320 120 Q 360 100 400 130 L 400 240 L 0 240 Z" fill="#CFF5E7" stroke="#10B981" stroke-width="1" opacity="0.6"/>
  <path d="M 0 160 Q 100 130 200 150 Q 300 170 400 150 L 400 240 L 0 240 Z" fill="#A7F3D0" opacity="0.5"/>
  <!-- Path -->
  <path d="M 40 200 Q 120 180 200 160 Q 280 140 340 100" stroke="#8B5CF6" stroke-width="3" fill="none" stroke-dasharray="8 6" stroke-linecap="round" opacity="0.7"/>
  <!-- Trees -->
  <g filter="url(#sh)">
    <rect x="70" y="120" width="6" height="40" rx="3" fill="#92400E"/>
    <circle cx="73" cy="110" r="22" fill="#10B981" opacity="0.9"/>
    <circle cx="73" cy="100" r="16" fill="#059669" opacity="0.8"/>
  </g>
  <g filter="url(#sh)">
    <rect x="280" y="100" width="6" height="40" rx="3" fill="#92400E"/>
    <circle cx="283" cy="90" r="20" fill="#10B981" opacity="0.9"/>
    <circle cx="283" cy="82" r="14" fill="#059669" opacity="0.8"/>
  </g>
  <!-- Person -->
  <g filter="url(#sh)">
    <circle cx="200" cy="145" r="10" fill="#FFDAB9" stroke="#E8A07A" stroke-width="1"/>
    <rect x="192" y="155" width="16" height="20" rx="4" fill="#8B5CF6"/>
    <circle cx="200" cy="135" r="3" fill="#1A1A2E" opacity="0.2"/>
  </g>
  <!-- Flag -->
  <g>
    <rect x="335" y="70" width="3" height="30" rx="1.5" fill="#1A1A2E"/>
    <path d="M 338 70 L 365 75 L 338 85 Z" fill="#EF4444" stroke="#991B1B" stroke-width="1"/>
  </g>
</svg>