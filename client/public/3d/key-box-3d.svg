<svg width="380" height="260" viewBox="0 0 380 260" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="boxInside" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#1A1A2E"/><stop offset="100%" stop-color="#2D2D44"/></linearGradient>
    <linearGradient id="goldKey" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#FFD700"/><stop offset="100%" stop-color="#B8860B"/></linearGradient>
    <filter id="sh"><feDropShadow dx="0" dy="12" stdDeviation="16" flood-opacity="0.15"/></filter>
  </defs>
  <ellipse cx="190" cy="230" rx="100" ry="14" fill="rgba(20,20,50,0.07)"/>
  <g filter="url(#sh)">
    <!-- Box base -->
    <path d="M 60 120 L 190 70 L 320 120 L 190 170 Z" fill="#8B5CF6" stroke="#6D28D9" stroke-width="1.5"/>
    <path d="M 60 120 L 60 180 L 190 230 L 190 170 Z" fill="#7C3AED" stroke="#6D28D9" stroke-width="1.5"/>
    <path d="M 190 170 L 190 230 L 320 180 L 320 120 Z" fill="#A78BFA" stroke="#6D28D9" stroke-width="1.5"/>
    <!-- Inside velvet -->
    <path d="M 75 130 L 190 85 L 305 130 L 190 160 Z" fill="url(#boxInside)"/>
    <!-- Key -->
    <g transform="rotate(-15 190 125)">
      <ellipse cx="190" cy="125" rx="22" ry="22" fill="none" stroke="url(#goldKey)" stroke-width="6"/>
      <ellipse cx="190" cy="125" rx="10" ry="10" fill="url(#goldKey)"/>
      <rect x="188" y="125" width="70" height="10" rx="3" fill="url(#goldKey)" stroke="#B8860B" stroke-width="1"/>
      <rect x="240" y="118" width="14" height="8" rx="2" fill="url(#goldKey)" stroke="#B8860B" stroke-width="1"/>
      <rect x="240" y="132" width="10" height="6" rx="2" fill="url(#goldKey)" stroke="#B8860B" stroke-width="1"/>
      <!-- Sparkle -->
      <g fill="white" opacity="0.8">
        <circle cx="175" cy="110" r="2"/>
        <circle cx="210" cy="135" r="1.5"/>
      </g>
    </g>
    <!-- Box highlight -->
    <path d="M 80 125 L 100 115" stroke="rgba(255,255,255,0.3)" stroke-width="2" stroke-linecap="round"/>
  </g>
  <!-- Label -->
  <text x="190" y="250" text-anchor="middle" font-family="Fraunces, serif" font-size="14" font-weight="700" fill="#1A1A2E">50% Complete!</text>
</svg>