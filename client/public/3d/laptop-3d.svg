<svg width="400" height="240" viewBox="0 0 400 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="lid" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#E8E8F0"/><stop offset="100%" stop-color="#C5C5D6"/></linearGradient>
    <linearGradient id="screen" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#1A1A2E"/><stop offset="100%" stop-color="#2D2D44"/></linearGradient>
    <linearGradient id="base" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#F0F0F5"/><stop offset="100%" stop-color="#D8D8E8"/></linearGradient>
    <filter id="sh"><feDropShadow dx="0" dy="12" stdDeviation="16" flood-opacity="0.12"/></filter>
  </defs>
  <ellipse cx="200" cy="205" rx="120" ry="16" fill="rgba(20,20,50,0.07)"/>
  <g filter="url(#sh)">
    <!-- Base -->
    <path d="M 80 150 L 320 150 L 330 170 L 70 170 Z" fill="url(#base)" stroke="#C5C5D6" stroke-width="1.5"/>
    <!-- Keyboard -->
    <path d="M 95 152 L 305 152 L 298 165 L 102 165 Z" fill="white" opacity="0.6"/>
    <!-- Lid -->
    <g transform="rotate(-8 200 80)">
      <rect x="70" y="40" width="260" height="150" rx="12" fill="url(#lid)" stroke="#C5C5D6" stroke-width="1.5"/>
      <rect x="85" y="55" width="230" height="120" rx="6" fill="url(#screen)"/>
      <!-- Screen content - chart -->
      <g opacity="0.9">
        <rect x="100" y="70" width="60" height="8" rx="4" fill="#FFB68A" opacity="0.9"/>
        <rect x="100" y="85" width="40" height="6" rx="3" fill="white" opacity="0.3"/>
        <rect x="100" y="100" width="200" height="50" rx="6" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.15)"/>
        <path d="M 110 135 L 130 110 L 150 120 L 170 95 L 190 105 L 210 85 L 230 90 L 250 80 L 270 95" stroke="#FFB68A" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="270" cy="95" r="4" fill="#FFB68A" stroke="white" stroke-width="1.5"/>
      </g>
      <!-- Camera -->
      <circle cx="200" cy="50" r="2" fill="#1A1A2E" opacity="0.5"/>
    </g>
    <!-- Hinge -->
    <rect x="140" y="148" width="120" height="6" rx="3" fill="#C5C5D6"/>
  </g>
</svg>