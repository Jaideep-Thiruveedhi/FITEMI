<svg width="400" height="280" viewBox="0 0 400 280" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#FFD700"/><stop offset="100%" stop-color="#B8860B"/></linearGradient>
    <linearGradient id="green" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#10B981"/><stop offset="100%" stop-color="#059669"/></linearGradient>
    <filter id="sh"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-opacity="0.12"/></filter>
  </defs>
  <ellipse cx="200" cy="250" rx="80" ry="12" fill="rgba(20,20,50,0.07)"/>
  <g filter="url(#sh)">
    <!-- Base -->
    <ellipse cx="200" cy="230" rx="45" ry="10" fill="#2D2D44"/>
    <rect x="195" y="100" width="10" height="130" rx="5" fill="#1A1A2E"/>
    <!-- Beam -->
    <rect x="80" y="105" width="240" height="12" rx="6" fill="#1A1A2E"/>
    <circle cx="200" cy="111" r="8" fill="#FFB68A" stroke="#1A1A2E" stroke-width="2"/>
    <!-- Left pan - gold -->
    <line x1="100" y1="111" x2="70" y2="160" stroke="#1A1A2E" stroke-width="1.5"/>
    <line x1="100" y1="111" x2="130" y2="160" stroke="#1A1A2E" stroke-width="1.5"/>
    <ellipse cx="100" cy="170" rx="42" ry="10" fill="#B8860B" opacity="0.3"/>
    <ellipse cx="100" cy="165" rx="40" ry="12" fill="url(#gold)" stroke="#B8860B" stroke-width="1.5"/>
    <g transform="translate(100,145)">
      <rect x="-18" y="-12" width="36" height="24" rx="4" fill="#FFD700" stroke="#B8860B" stroke-width="1"/>
      <text x="0" y="5" text-anchor="middle" font-size="10" font-weight="700" fill="#1A1A2E">₹</text>
    </g>
    <!-- Right pan - green -->
    <line x1="300" y1="111" x2="270" y2="160" stroke="#1A1A2E" stroke-width="1.5"/>
    <line x1="300" y1="111" x2="330" y2="160" stroke="#1A1A2E" stroke-width="1.5"/>
    <ellipse cx="300" cy="170" rx="42" ry="10" fill="#059669" opacity="0.3"/>
    <ellipse cx="300" cy="165" rx="40" ry="12" fill="url(#green)" stroke="#059669" stroke-width="1.5"/>
    <g transform="translate(300,145)">
      <rect x="-20" y="-14" width="40" height="28" rx="6" fill="#10B981" stroke="#059669" stroke-width="1"/>
      <text x="0" y="4" text-anchor="middle" font-size="8" font-weight="600" fill="white">SAVINGS</text>
    </g>
  </g>
</svg>